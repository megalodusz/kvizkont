<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvíz kitöltő</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial; text-align: center; margin: 0; padding: 15px; background: #f0f2f5; user-select: none; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .answer-btn { padding: 40px 10px; font-size: 26px; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; }
        .btn-A { background: #e21b3c; box-shadow: 0 4px #b0102a; } .btn-B { background: #1368ce; box-shadow: 0 4px #0d4b97; }
        .btn-C { background: #d89e00; box-shadow: 0 4px #a07500; } .btn-D { background: #26890c; box-shadow: 0 4px #1a6008; }
        .open-input { width: 100%; padding: 15px; font-size: 20px; font-weight: bold; text-align: center; border-radius: 10px; border: 2px solid #ccc; box-sizing: border-box; margin-bottom: 15px; }
        .hidden { display: none !important; }
        .setup-btn { width: 100%; padding: 15px; margin-top: 15px; font-size: 18px; font-weight: bold; color: white; background: #008CBA; border: none; border-radius: 8px; cursor: pointer; }
        
        #reader {     width: 100%;     margin: 15px auto;     background: #fafafa; border-radius: 8px;     border: 2px dashed #bbb; 
    min-height: 250px;    overflow: hidden; /* Biztosítja, hogy a videó ne csússzon ki a keretből */}
                
        #timer-bar { width: 100%; background: #ddd; height: 12px; border-radius: 6px; margin-top: 15px; overflow: hidden; }
        #timer-progress { width: 100%; height: 100%; background: #ff9800; transition: width 0.1s linear; }
        .correct-line { color: #26890c; margin: 5px 0; } .wrong-line { color: #e21b3c; margin: 5px 0; }
    </style>
</head>
<body>
<div class="container">
    <div id="qr-screen">
        <h2>Szkenneld be a QR kódot!</h2>
        <button class="setup-btn" style="background:#4CAF50;" onclick="startCamera()">Kamera Indítása</button>
        <div id="reader"></div><p id="qr-status" style="font-weight:bold;color:#e21b3c;"></p>
    </div>
    <div id="name-screen" class="hidden">
        <h2>Add meg a neved!</h2>
        <input type="text" id="player-name" placeholder="Neved" oninput="checkNameInput()" style="width:100%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc; box-sizing:border-box;">
        <button id="start-quiz-btn" class="setup-btn hidden" style="background:#4CAF50;" onclick="initQuiz()">Játék indítása</button>
    </div>
    <div id="quiz-screen" class="hidden">
        <div style="display:flex; justify-content:space-between; font-weight:bold;"><span id="question-counter">1. Kérdés</span></div>
        <div id="timer-bar"><div id="timer-progress"></div></div>
        <div id="multiple-choice-ui" class="btn-grid">
            <button class="answer-btn btn-A" onclick="submitAnswer('A')">A</button><button class="answer-btn btn-B" onclick="submitAnswer('B')">B</button>
            <button class="answer-btn btn-C" onclick="submitAnswer('C')">C</button><button class="answer-btn btn-D" onclick="submitAnswer('D')">D</button>
        </div>
        <div id="open-question-ui" class="hidden" style="margin-top:20px;">
            <input type="text" id="open-answer-field" class="open-input" placeholder="Írd ide a választ..." onkeydown="if(event.key==='Enter') submitOpenAnswer()">
            <button class="setup-btn" style="background:#ff9800;" onclick="submitOpenAnswer()">Válasz küldése</button>
        </div>
        <div class="status" id="status-text" style="margin-top:15px; font-weight:bold; color:#555;"></div>
    </div>
    <div id="result-screen" class="hidden">
        <h2>Az eredményed:</h2>
        <div style="font-size:32px; font-weight:bold; color:#4CAF50; margin:10px 0;" id="score-text">0 pont</div>
        <div style="font-size:18px; font-weight:bold; color:#555; margin-bottom:20px;" id="total-time-text">0.0 mp</div>
        <p id="stats-text" style="white-space:pre-line; text-align:left; background:#eee; padding:15px; border-radius:8px;"></p>
        <button class="setup-btn" style="background:#673AB7;" onclick="toggleAnswers()">A kvíz kiértékelése</button>
        <div id="answers-list" class="hidden" style="text-align:left; background:#fff; border:1px solid #ccc; padding:15px; border-radius:8px; margin-top:10px; font-weight:bold;"></div>
        <button class="setup-btn" onclick="location.reload()">Új játék</button>
    </div>
</div>

<script>
    let correctAnswers=[], playerAnswers=[], currentQuestionIndex=0, correctCount=0, totalTimeSpent=0, timeLeft=60, timerInterval, html5QrCode; const TIME_LIMIT = 60;
    
    function startCamera() { 
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader"); 
        
        const config = { 
            fps: 10, 
            qrbox: { width: 250, height: 250 } 
        };

        html5QrCode.start(
            { facingMode: { exact: "environment" } }, 
            config, 
            onScanSuccess,
            () => {}
        ).catch((err) => {
            console.log("Hátlapi kamera nem elérhető, próbálkozás az alapértelmezettel...", err);
            html5QrCode.start(
                { facingMode: "user" }, 
                config, 
                onScanSuccess,
                () => {}
            ).catch((fallbackErr) => {
                document.getElementById('qr-status').innerText = "Kamera hiba. HTTPS kapcsolat vagy kamera engedély szükséges!"; 
            });
        }); 
    }

    function onScanSuccess(text) { 
        if(text.trim().length > 0) { 
            let rawItems = text.trim().split(',').map(i => i.trim());
            let offset = parseInt(rawItems[0], 10);
            
            if (isNaN(offset) || offset < 1 || offset >= rawItems.length) {
                document.getElementById('qr-status').innerText = "Hibás QR kód formátum.";
                return;
            }
            
            correctAnswers = rawItems.slice(offset).map(i => i.toUpperCase());
            
            if (html5QrCode?.isScanning) { 
                html5QrCode.stop().then(() => { 
                    document.getElementById('reader').innerHTML = ""; 
                    document.getElementById('qr-screen').classList.add('hidden'); 
                    document.getElementById('name-screen').classList.remove('hidden'); 
                }); 
            } 
        } 
    }

    function checkNameInput() {
        const nameVal = document.getElementById('player-name').value.trim();
        const startBtn = document.getElementById('start-quiz-btn');
        if (nameVal.length > 0) {
            startBtn.classList.remove('hidden');
        } else {
            startBtn.classList.add('hidden');
        }
    }
    
    function initQuiz() { 
        if(!document.getElementById('player-name').value.trim()) { alert("Adj meg egy nevet!"); return; } 
        document.getElementById('name-screen').classList.add('hidden'); 
        document.getElementById('quiz-screen').classList.remove('hidden'); 
        startQuestion(); 
    }
    
    function startQuestion() { 
        timeLeft = TIME_LIMIT; 
        document.getElementById('question-counter').innerText = `${currentQuestionIndex + 1}. Kérdés`; 
        document.getElementById('status-text').innerText = `Kérdések: ${currentQuestionIndex + 1} / ${correctAnswers.length}`; 
        document.getElementById('open-answer-field').value = ""; 
        let cur = correctAnswers[currentQuestionIndex]; 
        let isMC = ["A", "B", "C", "D"].includes(cur); 
        document.getElementById('multiple-choice-ui').classList.toggle('hidden', !isMC); 
        document.getElementById('open-question-ui').classList.toggle('hidden', isMC); 
        if(!isMC) setTimeout(() => document.getElementById('open-answer-field').focus(), 50); 
        clearInterval(timerInterval); 
        timerInterval = setInterval(() => { 
            timeLeft -= 0.1; 
            if (timeLeft < 0) timeLeft = 0; 
            document.getElementById('timer-progress').style.width = `${(timeLeft / TIME_LIMIT) * 100}%`; 
            if (timeLeft <= 0) { 
                clearInterval(timerInterval); 
                submitOpenAnswerTimeout(); 
            } 
        }, 100); 
    }
    
    function submitAnswer(letter) { clearInterval(timerInterval); playerAnswers.push(letter); processAnswer(parseFloat((TIME_LIMIT - timeLeft).toFixed(1))); }
    function submitOpenAnswer() { clearInterval(timerInterval); let ans = document.getElementById('open-answer-field').value.trim(); playerAnswers.push(ans || "NINCS VÁLASZ"); processAnswer(parseFloat((TIME_LIMIT - timeLeft).toFixed(1))); }
    function submitOpenAnswerTimeout() { playerAnswers.push("IDŐ LEJÁRT"); processAnswer(TIME_LIMIT); }
    
    function processAnswer(timeTaken) { 
        totalTimeSpent += timeTaken; 
        currentQuestionIndex++; 
        if(currentQuestionIndex < correctAnswers.length) { 
            startQuestion(); 
        } else { 
            calculateFinalScore();
            showResults(); 
        } 
    }
    
    function calculateFinalScore() {
        correctCount = 0;
        for(let i=0; i<correctAnswers.length; i++) {
            if(checkMatch(playerAnswers[i], correctAnswers[i]) || playerAnswers[i] === correctAnswers[i]) {
                correctCount++;
            }
        }
    }
    
    function showResults() { 
        document.getElementById('quiz-screen').classList.add('hidden'); 
        document.getElementById('result-screen').classList.remove('hidden'); 
        document.getElementById('score-text').innerText = `${correctCount} / ${correctAnswers.length} pont`; 
        document.getElementById('total-time-text').innerText = `${totalTimeSpent.toFixed(1)} másodperc`; 
        let pName = document.getElementById('player-name').value.trim(); 
        document.getElementById('stats-text').innerText = `Játékos: ${pName}\nHelyes válaszok aránya: ${((correctCount/correctAnswers.length)*100).toFixed(0)}%`; 
        let listHtml = ""; 
        for(let i=0; i<correctAnswers.length; i++) { 
            let isCorrect = checkMatch(playerAnswers[i], correctAnswers[i]) || playerAnswers[i] === correctAnswers[i]; 
            listHtml += `<div class="${isCorrect ? 'correct-line' : 'wrong-line'}">${i+1}. Válaszod: ${playerAnswers[i]} |<br> Helyes válasz: ${correctAnswers[i]}</div>`; 
        } 
        document.getElementById('answers-list').innerHTML = listHtml; 
    }
    
    function toggleAnswers() { document.getElementById('answers-list').classList.toggle('hidden'); }
    function cleanStr(s) { return s ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Z0-9]/g, "") : ""; }
    
    function checkMatch(a, b) { 
        let ca = cleanStr(a), cb = cleanStr(b); 
        if (ca === cb) return true; 
        if (cb.length < 4) return false; 
        
        let dp = Array.from({length:ca.length+1},()=>Array(cb.length+1).fill(0)); 
        for(let i=0;i<=ca.length;i++) dp[i][0]=i; 
        for(let j=0;j<=cb.length;j++) dp[0][j]=j; 
        
        for(let i=1;i<=ca.length;i++) { 
            for(let j=1;j<=cb.length;j++) { 
                dp[i][j] = ca[i-1] === cb[j-1] ? dp[i-1][j-1] : Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]) + 1; 
            } 
        } 
        return dp[ca.length][cb.length] <= 1; 
    }
</script>
</body>
</html>
